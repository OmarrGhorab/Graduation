# Docker Compose for Local Development
# Single instance per service for easier debugging

services:
  # Databases
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: graduation
      POSTGRES_PASSWORD: graduation_secret
      POSTGRES_DB: graduation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Single instances for development
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - ALLOWED_ORIGINS=*
      - AUTH_SERVICE_URLS=http://auth-service:6001
      - NOTIFICATION_SERVICE_URLS=http://notification-service:6003
      - CHAT_SERVICE_URLS=http://chat-service:6004
      - RECOMMENDATION_SERVICE_URLS=http://recommendation-service:8095
      - INTERNAL_SERVICE_SECRET=graduation-mega-secret-2026
    depends_on:
      - auth-service
      - notification-service
      - chat-service
      - recommendation-service

  auth-service:
    build: ./auth-service
    ports:
      - "6001:6001"
    environment:
      - PORT=6001
      - NODE_ENV=development
      - DATABASE_URL=postgresql://graduation:graduation_secret@postgres:5432/graduation
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  notification-service:
    build: ./notification-service
    ports:
      - "6003:6003"
    environment:
      - PORT=6003
      - NODE_ENV=development
      - DATABASE_URL=postgresql://graduation:graduation_secret@postgres:5432/graduation
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  chat-service:
    build: ./chat-service
    ports:
      - "6004:6004"
    environment:
      - PORT=6004
      - ENV=development
      - DATABASE_URL=postgresql://graduation:graduation_secret@postgres:5432/graduation?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=47079cb745e7b5c1ebaa8106cabc00f43d6356ce3b0d4b725156742f4084280b
      - INTERNAL_SERVICE_SECRET=graduation-mega-secret-2026
      - NOTIFICATION_SERVICE_URL=http://notification-service:6003
      - AUTH_SERVICE_URL=http://auth-service:6001
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - postgres
      - redis
      - kafka

  # WS Gateway - WebSocket server on port 3001
  ws-gateway:
    build: ./ws-gateway
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - CHAT_SERVICE_URL=http://chat-service:6004
      - JWT_SECRET=47079cb745e7b5c1ebaa8106cabc00f43d6356ce3b0d4b725156742f4084280b
      - INTERNAL_SERVICE_SECRET=graduation-mega-secret-2026
    depends_on:
      - redis
      - kafka
      - chat-service

  recommendation-service:
    build: ./recommendation-service
    ports:
      - "8095:8095"
    environment:
      - SERVER_PORT=8095
      - PORT=8095
      - DATABASE_URL=postgresql://graduation:graduation_secret@postgres:5432/graduation
      - REDIS_URL=redis://redis:6379
      - VECTOR_DB_URL=http://qdrant:6333
      - AGENT_RECOMMENDATIONS_ENABLED=true
      - EMBEDDING_MODEL_NAME=BAAI/bge-small-en-v1.5
      - RETRIEVAL_TOP_K=20
      - AGENT_MAX_TOOL_CALLS=8
      - CLUSTER_COUNT=8
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-5.4-mini}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.freemodel.dev}
      - AI_WIRE_API=${AI_WIRE_API:-responses}
      - AI_REASONING_EFFORT=${AI_REASONING_EFFORT:-medium}
      - DISABLE_RESPONSE_STORAGE=${DISABLE_RESPONSE_STORAGE:-true}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:3000}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-Graduation Platform}
      - COURSES_SERVICE_URL=http://courses-service:8085
      - AUTH_SERVICE_URL=http://auth-service:6001
      - INTERNAL_SERVICE_SECRET=graduation-mega-secret-2026
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDINARY_FOLDER=chatbot-media
      - NOTIFICATION_SERVICE_URL=http://notification-service:6003
    depends_on:
      - postgres
      - redis
      - qdrant
      - auth-service
      - notification-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
